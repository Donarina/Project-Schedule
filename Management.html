<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理甘特图 · 云端同步</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ========== 完整样式（包含所有原始样式 + 登录界面）========== */
        :root {
            --bg: #f4f6f9;
            --card: #ffffff;
            --border: #e2e6ed;
            --text: #1e293b;
            --text-light: #64748b;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --gantt-row-h: 44px;
            --gantt-header-h: 52px;
            --left-w: 360px;
            --today-color: #ef4444;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .logo { font-size: 1.25rem; font-weight: 700; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 0.8rem; }
        .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-outline { border-color: var(--border); }
        .btn-xs { padding: 2px 8px; font-size: 0.7rem; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 380px; background: var(--card); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; }
        .gantt-area { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .gantt-toolbar { padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .granularity-bar { display: flex; gap: 4px; background: #f1f5f9; border-radius: 20px; padding: 2px; }
        .granularity-btn { padding: 4px 12px; border: none; background: transparent; border-radius: 20px; cursor: pointer; }
        .granularity-btn.active { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .gantt-scroll { flex: 1; overflow: auto; }
        .gantt-table { width: max-content; min-width: 100%; }
        .gantt-header-row, .gantt-row { display: flex; }
        .gantt-left { width: var(--left-w); position: sticky; left: 0; background: #fff; border-right: 1px solid var(--border); padding: 0 12px; display: flex; align-items: center; }
        .gantt-right { flex: 1; display: flex; }
        .gantt-unit { border-right: 1px solid #eee; text-align: center; font-size: 0.7rem; }
        .gantt-bar { position: absolute; border-radius: 4px; background: #3b82f6; color: #fff; font-size: 0.7rem; padding: 0 6px; white-space: nowrap; overflow: hidden; cursor: pointer; }
        .task-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 8px; }
        .task-header { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .progress-bar { height: 4px; background: #e5e7eb; border-radius: 2px; margin: 6px 0; }
        .progress-fill { height: 100%; background: var(--success); border-radius: 2px; }
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #fff; padding: 32px; border-radius: 16px; width: 360px; text-align: center; box-shadow: var(--shadow-md); }
        .login-card input { width: 100%; margin-bottom: 12px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
        .login-card button { width: 100%; margin-top: 6px; }
        input, select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); }
        .input-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .section-title { font-weight: 600; margin: 12px 0 8px; }
        .person-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .status-badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 12px; }
        .status-done { background: #d1fae5; color: #065f46; }
        .status-progress { background: #fff3e0; color: #9a3412; }
        .status-todo { background: #f1f5f9; color: #475569; }
        #ganttApp { height: 100vh; flex-direction: column; }
    </style>
</head>
<body>

<!-- 登录界面 -->
<div id="loginPanel" class="login-container">
    <div class="login-card">
        <h2>📊 甘特图 · 云端同步</h2>
        <p>登录后数据自动保存，多设备同步</p>
        <input type="email" id="loginEmail" placeholder="邮箱">
        <input type="password" id="loginPassword" placeholder="密码">
        <button class="btn btn-primary" id="btnLogin">登录</button>
        <button class="btn btn-outline" id="btnSignup" style="margin-top: 10px;">注册新账号</button>
    </div>
</div>

<!-- 甘特图主界面 -->
<div id="ganttApp" style="display: none;">
    <div class="header">
        <div class="logo">📊 项目管理甘特图 · 云端同步</div>
        <div style="display: flex; gap: 8px;">
            <span id="userEmailSpan"></span>
            <button class="btn btn-outline" id="btnLogout">退出</button>
            <button class="btn btn-outline" onclick="manualSave()">保存</button>
            <button class="btn btn-outline" onclick="loadDemoData()">示例数据</button>
            <button class="btn btn-outline" onclick="exportData()">导出</button>
            <label class="btn btn-outline" style="cursor:pointer;">导入<input type="file" accept=".json" hidden onchange="importData(event)"></label>
            <button class="btn btn-outline" onclick="clearAllData()">清空</button>
        </div>
    </div>
    <div class="main-container">
        <div class="sidebar">
            <div class="section-title">🔍 过滤</div>
            <input type="text" id="searchKeyword" placeholder="搜索任务/人员..." style="width:100%; margin-bottom:16px;">
            
            <div class="section-title">👥 人员管理</div>
            <div class="input-row">
                <input type="text" id="personName" placeholder="姓名" style="flex:2;">
                <input type="color" id="personColor" value="#3b82f6" style="width:40px;">
                <button class="btn btn-primary btn-xs" onclick="addPerson()">+</button>
            </div>
            <ul id="peopleList" style="list-style:none; margin-bottom:16px;"></ul>
            
            <div class="section-title">📁 项目</div>
            <div class="input-row">
                <input type="text" id="projectName" placeholder="项目名称" style="flex:2;">
                <button class="btn btn-primary btn-xs" onclick="addProject()">+</button>
            </div>
            <ul id="projectsList" style="list-style:none; margin-bottom:16px;"></ul>
            
            <div class="section-title">📝 新建任务</div>
            <input type="text" id="taskName" placeholder="任务名称" style="width:100%; margin-bottom:8px;">
            <select id="taskProject" style="width:100%; margin-bottom:8px;"><option value="">无项目</option></select>
            <select id="taskPerson" multiple size="2" style="width:100%; margin-bottom:8px;"></select>
            <div class="input-row">
                <input type="date" id="taskStartDate" style="flex:1;">
                <input type="date" id="taskEndDate" style="flex:1;">
            </div>
            <select id="taskStatus" style="width:100%; margin-bottom:8px;">
                <option value="todo">未开始</option>
                <option value="in-progress">进行中</option>
                <option value="done">已完成</option>
            </select>
            <div class="input-row">
                <input type="range" id="taskProgress" min="0" max="100" value="0" style="flex:1;">
                <span id="progVal">0%</span>
            </div>
            <button class="btn btn-primary btn-xs" onclick="addTask()" style="width:100%;">+ 添加任务</button>
            <div id="tasksList" style="margin-top: 20px;"></div>
        </div>
        <div class="gantt-area">
            <div class="gantt-toolbar">
                <span id="ganttInfoText">📅 共 0 个任务</span>
                <div class="granularity-bar" id="granularityBar">
                    <button class="granularity-btn active" data-gran="day">按天</button>
                    <button class="granularity-btn" data-gran="month">按月</button>
                    <button class="granularity-btn" data-gran="quarter">按季度</button>
                    <button class="granularity-btn" data-gran="year">按年</button>
                </div>
            </div>
            <div class="gantt-scroll" id="ganttScroll">
                <div class="gantt-table" id="ganttTable"></div>
            </div>
        </div>
    </div>
</div>

<script>
// ========== 1. Supabase 配置 ==========
// 注意：SUPABASE_URL 必须是项目根地址，不要带 /rest/v1/
// 前端只能使用 Publishable key / anon public key，不能使用 Secret key / service_role key。
const SUPABASE_URL = 'https://bymeuixlakbqeapoztqg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Sg8GBHs3aQS0CuY71EEqAA_R4GKThED';

// CDN 加载后，SDK 位于 window.supabase。客户端实例不要命名为 supabase，避免与 SDK 全局对象冲突。
const supabaseClient = window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
    : null;

function ensureSupabaseReady() {
    if (!supabaseClient) {
        console.error('Supabase SDK 未加载成功，请检查 CDN 网络或 script 标签。');
        alert('Supabase SDK 未加载成功，请检查网络/CDN，或将 CDN 地址换成 unpkg。');
        return false;
    }
    return true;
}

// ========== 全局变量 ==========
let currentUser = null;
let data = { people: [], projects: [], tasks: [] };
let filterKw = '';
let gran = 'day';
let expanded = {};

const UNIT_W = { day:28, month:56, quarter:80, year:100 };
function getUW() { return UNIT_W[gran] || 28; }

// ========== 云端数据操作 ==========
async function loadUserData() {
    if (!ensureSupabaseReady()) return;
    if (!currentUser) return;
    const { data: userData, error } = await supabaseClient
        .from('user_data')
        .select('people, projects, tasks')
        .eq('user_id', currentUser.id)
        .maybeSingle();
    if (error && error.code !== 'PGRST116') {
        console.error(error);
        alert('加载数据失败: ' + error.message);
        return;
    }
    if (userData) {
        data = userData;
        // 兼容旧数据
        (data.tasks || []).forEach(t => {
            if (!t.personIds) t.personIds = [];
            if (t.progress === undefined) t.progress = 0;
            if (!t.subtasks) t.subtasks = [];
        });
    } else {
        data = { people: [], projects: [], tasks: [] };
        await saveUserData();
    }
    renderAll();
}

async function saveUserData() {
    if (!ensureSupabaseReady()) return;
    if (!currentUser) return;
    const { error } = await supabaseClient
        .from('user_data')
        .upsert({
            user_id: currentUser.id,
            people: data.people,
            projects: data.projects,
            tasks: data.tasks,
            updated_at: new Date()
        }, { onConflict: 'user_id' });
    if (error) console.error('保存失败', error);
}

async function syncData() {
    await saveUserData();
}

// ========== 登录/注册/登出 ==========
async function handleLogin() {
    console.log('登录按钮已点击');
    if (!ensureSupabaseReady()) return;
    const email = document.getElementById('loginEmail').value.trim();
    const pwd = document.getElementById('loginPassword').value.trim();
    if (!email || !pwd) return alert('请输入邮箱和密码');
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password: pwd });
    if (error) return alert('登录失败: ' + error.message);
    const { data: { user } } = await supabaseClient.auth.getUser();
    currentUser = user;
    await loadUserData();
    document.getElementById('loginPanel').style.display = 'none';
    document.getElementById('ganttApp').style.display = 'block';
    document.getElementById('userEmailSpan').innerText = currentUser.email;
}

async function handleSignup() {
    console.log('注册按钮已点击');
    if (!ensureSupabaseReady()) return;
    const email = document.getElementById('loginEmail').value.trim();
    const pwd = document.getElementById('loginPassword').value.trim();
    if (!email || !pwd) return alert('请输入邮箱和密码');
    const { data: signUpData, error } = await supabaseClient.auth.signUp({ email, password: pwd });
    if (error) return alert('注册失败: ' + error.message);
    if (signUpData && signUpData.session) {
        currentUser = signUpData.user;
        await loadUserData();
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('ganttApp').style.display = 'block';
        document.getElementById('userEmailSpan').innerText = currentUser.email;
        alert('注册成功，已自动登录。');
    } else {
        alert('注册成功！如果开启了邮箱确认，请先到邮箱点击确认链接；如果已关闭邮箱确认，请直接登录。');
        document.getElementById('loginPassword').value = '';
    }
}

async function handleLogout() {
    if (!ensureSupabaseReady()) return;
    await supabaseClient.auth.signOut();
    currentUser = null;
    document.getElementById('loginPanel').style.display = 'flex';
    document.getElementById('ganttApp').style.display = 'none';
}

// ========== CRUD 操作 ==========
window.addPerson = async () => {
    const name = document.getElementById('personName').value.trim();
    if (!name) return;
    data.people.push({ id: Date.now().toString(36), name, color: document.getElementById('personColor').value });
    document.getElementById('personName').value = '';
    await syncData();
    renderAll();
};
window.deletePerson = async (id) => {
    if (!confirm('删除人员？')) return;
    data.people = data.people.filter(p => p.id !== id);
    data.tasks.forEach(t => t.personIds = (t.personIds || []).filter(pid => pid !== id));
    await syncData();
    renderAll();
};
window.addProject = async () => {
    const name = document.getElementById('projectName').value.trim();
    if (!name) return;
    data.projects.push({ id: Date.now().toString(36), name });
    document.getElementById('projectName').value = '';
    await syncData();
    renderAll();
};
window.deleteProject = async (id) => {
    if (!confirm('删除项目及任务？')) return;
    data.projects = data.projects.filter(p => p.id !== id);
    data.tasks = data.tasks.filter(t => t.projectId !== id);
    await syncData();
    renderAll();
};
window.addTask = async () => {
    const name = document.getElementById('taskName').value.trim();
    const projId = document.getElementById('taskProject').value || null;
    const pids = Array.from(document.getElementById('taskPerson').selectedOptions).map(o => o.value);
    const start = document.getElementById('taskStartDate').value;
    const end = document.getElementById('taskEndDate').value;
    const status = document.getElementById('taskStatus').value;
    const prog = parseInt(document.getElementById('taskProgress').value) || 0;
    if (!name || !start || !end) return alert('请填写完整');
    if (end < start) return alert('结束日期不能早于开始');
    data.tasks.push({
        id: Date.now().toString(36), projectId: projId, personIds: pids, name,
        startDate: start, endDate: end, status, progress: prog, subtasks: []
    });
    await syncData();
    renderAll();
};
window.deleteTask = async (id) => {
    if (confirm('删除任务？')) {
        data.tasks = data.tasks.filter(t => t.id !== id);
        await syncData();
        renderAll();
    }
};
window.manualSave = async () => { await syncData(); alert('已保存到云端'); };
window.loadDemoData = async () => {
    if (data.tasks.length && !confirm('覆盖当前数据？')) return;
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const d = day => new Date(y, m, day).toISOString().slice(0,10);
    data.people = [
        { id:'p1', name:'张伟', color:'#3b82f6' },
        { id:'p2', name:'李娜', color:'#8b5cf6' }
    ];
    data.projects = [{ id:'pr1', name:'产品发布' }];
    data.tasks = [{
        id:'t1', projectId:'pr1', personIds:['p1','p2'], name:'需求分析',
        startDate:d(now.getDate()-5), endDate:d(now.getDate()+2), status:'done', progress:100, subtasks:[]
    }];
    await syncData();
    renderAll();
    alert('示例数据已加载');
};
window.exportData = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'gantt.json'; a.click();
};
window.importData = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
        try {
            const imp = JSON.parse(ev.target.result);
            if (!imp.people || !imp.projects || !imp.tasks) throw new Error();
            data = imp;
            await syncData();
            renderAll();
            alert('导入成功');
        } catch { alert('文件格式错误'); }
    };
    reader.readAsText(file);
};
window.clearAllData = async () => {
    if (confirm('清空所有数据？不可恢复')) {
        data = { people: [], projects: [], tasks: [] };
        await syncData();
        renderAll();
        alert('已清空');
    }
};

// ========== 渲染相关 ==========
function renderSidebar() {
    const peopleList = document.getElementById('peopleList');
    peopleList.innerHTML = data.people.map(p => `<li style="display:flex; justify-content:space-between; margin-bottom:6px;"><span><span class="person-dot" style="background:${p.color};"></span>${p.name}</span><button class="btn btn-xs" onclick="deletePerson('${p.id}')">×</button></li>`).join('');
    
    const projList = document.getElementById('projectsList');
    projList.innerHTML = data.projects.map(p => `<li style="display:flex; justify-content:space-between; margin-bottom:6px;">${p.name}<button class="btn btn-xs" onclick="deleteProject('${p.id}')">×</button></li>`).join('');
    
    const taskContainer = document.getElementById('tasksList');
    taskContainer.innerHTML = data.tasks.map(t => {
        const proj = data.projects.find(p => p.id === t.projectId);
        const persons = (t.personIds || []).map(id => data.people.find(p => p.id === id)).filter(Boolean);
        let statusClass = t.status === 'done' ? 'status-done' : (t.status === 'in-progress' ? 'status-progress' : 'status-todo');
        return `<div class="task-card">
            <div class="task-header" onclick="toggleExpand('${t.id}')">
                <span>▶</span>
                <div><strong>${t.name}</strong><br><span class="status-badge ${statusClass}">${t.status}</span> ${proj ? proj.name : '无项目'}</div>
                <span>${t.progress || 0}%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:${t.progress || 0}%;"></div></div>
            <div style="font-size:0.7rem;">${persons.map(p => `<span class="person-dot" style="background:${p.color};"></span>${p.name}`).join(' ')}</div>
        </div>`;
    }).join('');
}

function renderGantt() {
    const filtered = data.tasks.filter(t => {
        if (!filterKw) return true;
        const proj = data.projects.find(p => p.id === t.projectId);
        return t.name.includes(filterKw) || (proj && proj.name.includes(filterKw)) ||
               (t.personIds || []).some(pid => data.people.find(p => p.id === pid)?.name.includes(filterKw));
    });
    document.getElementById('ganttInfoText').innerText = `📅 共 ${filtered.length} 个任务`;
    if (!filtered.length) {
        document.getElementById('ganttTable').innerHTML = '<div style="padding:40px;text-align:center;">暂无任务</div>';
        return;
    }
    // 简化甘特图渲染（为保证可用性，只显示任务列表）
    let html = `<div class="gantt-header-row"><div class="gantt-left">任务</div><div class="gantt-right">时间</div></div>`;
    filtered.forEach(t => {
        html += `<div class="gantt-row"><div class="gantt-left">${t.name}</div><div class="gantt-right">${t.startDate} → ${t.endDate}</div></div>`;
    });
    document.getElementById('ganttTable').innerHTML = html;
}

function renderAll() {
    const projSel = document.getElementById('taskProject');
    projSel.innerHTML = '<option value="">无项目</option>' + data.projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    const personSel = document.getElementById('taskPerson');
    personSel.innerHTML = data.people.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    renderSidebar();
    renderGantt();
}

window.toggleExpand = (id) => { expanded[id] = !expanded[id]; renderSidebar(); };
window.applyFilter = () => { filterKw = document.getElementById('searchKeyword').value; renderGantt(); };
document.getElementById('searchKeyword')?.addEventListener('input', () => { filterKw = document.getElementById('searchKeyword').value; renderGantt(); });

// ========== 粒度切换（简化） ==========
document.getElementById('granularityBar')?.addEventListener('click', e => {
    const btn = e.target.closest('.granularity-btn');
    if (btn) {
        gran = btn.dataset.gran;
        document.querySelectorAll('.granularity-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGantt();
    }
});

// ========== 事件绑定 ==========
function bindEvent(id, eventName, handler) {
    const el = document.getElementById(id);
    if (!el) {
        console.error('找不到元素 #' + id + '，事件未绑定');
        return;
    }
    el.addEventListener(eventName, handler);
}
bindEvent('btnLogin', 'click', handleLogin);
bindEvent('btnSignup', 'click', handleSignup);
bindEvent('btnLogout', 'click', handleLogout);
document.getElementById('taskProgress')?.addEventListener('input', e => document.getElementById('progVal').innerText = e.target.value + '%');

// ========== 初始化 ==========
(async function init() {
    if (!ensureSupabaseReady()) return;
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
        currentUser = session.user;
        await loadUserData();
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('ganttApp').style.display = 'block';
        document.getElementById('userEmailSpan').innerText = currentUser.email;
    } else {
        document.getElementById('loginPanel').style.display = 'flex';
        document.getElementById('ganttApp').style.display = 'none';
    }
})();
</script>
</body>
</html>
